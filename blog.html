<style>

    --teal:#6A388D;     --teal-d:#472563;
    --coral:#EA5773;    --coral-d:#C93A56;
    --amber:#CE007F;    --amber-d:#970A5D;
    --blue:#2A2172;     --blue-d:#17123F;
    --pink:#DB3389;     --pink-d:#A80F63;
    --ink:#161319;
    --ink-soft:#8B879A;
    --paper:#FFFFFF;
    position:relative;
    background:var(--paper);
    overflow:hidden;
    padding:96px 24px 104px;
    font-family:'Montserrat',sans-serif;
    color:var(--ink);
    max-width:1240px;
    margin:0 auto;
  }
  .xm *{box-sizing:border-box; font-family:'Montserrat',sans-serif;}

  /* --- decoration --- */
  .xm-decor{
    position:absolute; border-radius:50%; z-index:0; pointer-events:none;
    filter:blur(2px);
  }
  .xm-decor-1{
    width:520px; height:520px; top:-260px; right:-180px;
    background:radial-gradient(circle at 30% 30%, #EA577322, #EA577300 70%);
    animation:xmFloatA 16s ease-in-out infinite;
  }
  .xm-decor-2{
    width:420px; height:420px; bottom:-200px; left:-160px;
    background:radial-gradient(circle at 60% 40%, #2A217222, #2A217200 70%);
    animation:xmFloatB 20s ease-in-out infinite;
  }
  .xm-decor-3{
    width:0; height:0;
    top:0; left:0; right:0; bottom:0; position:absolute;
    background-image:radial-gradient(circle, #EFEBF2 1px, transparent 1px);
    background-size:22px 22px;
    opacity:.8;
  }

  /* --- floating shapes (repositionadas para no encimarse con las tarjetas) --- */
  .xm-shape{
    position:absolute; z-index:0; pointer-events:none; display:block; opacity:.5;
  }
  .xm-shape-ring{
    border-radius:50%; border:2.5px solid currentColor; background:none;
  }
  .xm-shape-diamond{
    border:2.5px solid currentColor; background:none; transform:rotate(45deg);
  }
  .xm-shape-dot{ border-radius:50%; }
  .xm-shape-plus{ background:none; }
  .xm-shape-plus::before, .xm-shape-plus::after{
    content:''; position:absolute; background:currentColor;
  }
  .xm-shape-plus::before{ top:50%; left:0; width:100%; height:2.5px; transform:translateY(-50%); }
  .xm-shape-plus::after{ left:50%; top:0; height:100%; width:2.5px; transform:translateX(-50%); }

  .xm-s1{ width:64px; height:64px; top:5%;   left:2%;  color:var(--coral);  animation:xmFloatA 12s ease-in-out infinite; }
  .xm-s2{ width:38px; height:38px; top:14%;  right:3%; color:var(--blue);   animation:xmFloatB 15s ease-in-out infinite; }
  .xm-s3{ width:26px; height:26px; top:9%;   right:23%; color:var(--purple); animation:xmSpin 24s linear infinite, xmFloatA 10s ease-in-out infinite; }
  .xm-s4{ width:18px; height:18px; bottom:3%; left:3%;  color:var(--teal);  animation:xmSpin 18s linear infinite reverse; }
  .xm-s5{ width:12px; height:12px; top:48%;  left:0.5%; background:var(--amber); animation:xmFloatB 9s ease-in-out infinite; }
  .xm-s6{ width:9px;  height:9px;  top:52%;  right:1%;  background:var(--pink); animation:xmFloatA 11s ease-in-out infinite; }
  .xm-s7{ width:22px; height:22px; top:19%;  left:34%;  color:var(--amber); animation:xmFloatB 13s ease-in-out infinite; }
  .xm-s8{ width:16px; height:16px; bottom:2%; right:2%; color:var(--coral); animation:xmFloatA 17s ease-in-out infinite; }

  @keyframes xmFloatA{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(22px,-30px) rotate(14deg); }
  }
  @keyframes xmFloatB{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(-20px,26px) rotate(-12deg); }
  }
  @keyframes xmSpin{ to{ transform:rotate(360deg); } }

    padding:4px 10px; border-radius:999px;
  }

  .xm-news-title{
    position:relative; z-index:2;
    font-family:'Montserrat',sans-serif;
    color:#fff; font-weight:800; font-size:12.5px; line-height:1.28; margin:0 0 6px;
    letter-spacing:-.005em;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .xm-news-tag{ position:relative; z-index:2; font-family:'Montserrat',sans-serif; color:rgba(255,255,255,.82); font-size:10.5px; font-weight:700; }

  .xm-news-arrow{
    position:absolute; bottom:-15px; left:50%; transform:translateX(-50%);
    width:30px; height:30px; border-radius:50%; background:#fff; z-index:2;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 16px -4px rgba(22,19,25,.4);
    transition:transform .3s ease, background .3s ease;
  }
  .xm-news-arrow svg{ width:14px; height:14px; stroke:var(--ink); transition:stroke .3s ease; }
  .xm-news-card:hover .xm-news-arrow{ transform:translateX(-50%) translateY(3px) rotate(90deg); background:var(--ink); }
  .xm-news-card:hover .xm-news-arrow svg{ stroke:#fff; }

  @media (max-width:640px){
    .xm-news-track{ gap:26px; padding:60px 20px 32px; }
    .xm-news-card{ width:168px; height:168px; padding:0 18px 20px; }
    .xm-news-title{ font-size:11.5px; }

  .xm-head{
    display:flex; justify-content:center; text-align:center;
    margin-bottom:36px;
  }
  .xm-head-text{ max-width:720px; display:flex; flex-direction:column; align-items:center; }
  .xm-eyebrow{
    display:block; font-weight:700; font-size:13px; letter-spacing:.06em;
    color:var(--purple); margin-bottom:16px; font-family:'Courier New',monospace;

  .xm-head h2{

    letter-spacing:-.02em; margin:0 0 18px;

  .xm-head p{ font-size:17px; color:var(--ink-soft); margin:0; max-width:460px; font-weight:500; }

  /* --- search bar --- */

    display:flex; align-items:center; justify-content:center; gap:16px;

    margin-top:20px;
  }
  .xm-author{ display:flex; align-items:center; gap:8px; }
  .xm-author img{
    width:26px; height:26px; border-radius:50%; object-fit:cover;
    border:1.5px solid rgba(255,255,255,.7);
  }
  .xm-author-text{ line-height:1.2; }
  .xm-author-text small{ display:block; font-size:10px; color:rgba(255,255,255,.75); font-weight:600; }

  .xm-arrow{

  .xm-card:hover .xm-arrow{ transform:translateX(3px) rotate(0deg); background:#fff; }
  .xm-arrow svg{ width:16px; height:16px; stroke:#fff; transition:stroke .3s ease; }
  .xm-card:hover .xm-arrow svg{ stroke:var(--ink); }

  @media (max-width:640px){
    .xm{ padding:64px 16px 72px; }
    .xm-cover{ width:96px; height:96px; }
    .xm-card h3{ margin-top:44px; max-width:100%; }
    .xm-decor-1, .xm-decor-2{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .xm-card, .xm-mark, .xm-arrow, .xm-cover, .xm-news-card, .xm-news-clip, .xm-news-photo, .xm-tab-indicator{ transition:none; animation:none; }
    .xm-card{ opacity:1; transform:none; box-shadow:0 22px 40px -20px rgba(22,19,25,.32); }
    .xm-news-card{ opacity:1; transform:none; }
    .xm-news-clip{ box-shadow:0 22px 40px -20px rgba(22,19,25,.32); }
    .xm-decor-1, .xm-decor-2, .xm-shape{ animation:none; }
    .xm-tab-indicator{ background:linear-gradient(90deg, #CE007F, #EA5773, #6A388D, #2A2172); background-size:100% 100%; }
  }
</style>
